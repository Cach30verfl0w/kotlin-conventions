[versions]
conventions = "1.0.0"
jvmTarget = "21"
kotlin = "2.4.0" # https://github.com/JetBrains/kotlin/releases

metro = "1.3.0" # https://github.com/ZacSweers/metro/releases

# Gradle Plugins
gradle-compatibility = "1.0.0" # https://github.com/gradle/gradle-plugin-compatibility-plugin/releases
gradle-publish = "2.1.1" # https://plugins.gradle.org/plugin/com.gradle.plugin-publish
mavenPublish = "0.36.0" # https://github.com/vanniktech/gradle-maven-publish-plugin/releases
buildConfig = "6.0.10" # https://github.com/gmazzo/gradle-buildconfig-plugin/releases
detekt = "1.23.8" # https://github.com/detekt/detekt/releases

# Android
androidGradle = "8.13.2" # https://mvnrepository.com/artifact/com.android.tools.build/gradle
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "30"

# Compose-related
composeMultiplatform = "1.11.1" # https://github.com/JetBrains/compose-multiplatform/releases
androidx-activity = "1.13.0" # https://developer.android.com/jetpack/androidx/releases/activity
material3 = "1.11.0-alpha07" # https://github.com/JetBrains/compose-multiplatform/releases
compottie = "2.2.4" # https://github.com/alexzhirkevich/compottie/releases

[libraries]
metrox-android = { module = "dev.zacsweers.metro:metrox-android", version.ref = "metro" }
metrox-viewmodel = { module = "dev.zacsweers.metro:metrox-viewmodel", version.ref = "metro" }

# Compose
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }

compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
compottie-resources = { module = "io.github.alexzhirkevich:compottie-resources", version.ref = "compottie" }
metrox-viewmodel-compose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }

[plugins]
conventions = { id = "net.cacheoverflow.conventions.kotlin-conventions", version.ref = "conventions" }

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

buildConfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildConfig" }
gradle-compatibility = { id = "org.gradle.plugin-compatibility", version.ref = "gradle-compatibility" }
gradle-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-publish" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }