[versions]
kotlin-conventions = "1.0.0"
notescure = "1.0.0"

kotlin = "2.4.21" # https://github.com/JetBrains/kotlin/releases
jvmTarget = "25"

kotlinx-collections-immutable = "0.5.2" # https://github.com/Kotlin/kotlinx.collections.immutable/releases
kotlinx-serialization = "1.11.0" # https://github.com/Kotlin/kotlinx.serialization/releases
camerax = "1.6.2" # https://developer.android.com/jetpack/androidx/releases/camera
zxing = "3.1.1" # https://github.com/zxing-cpp/zxing-cpp/releases
metro = "1.4.5" # https://github.com/ZacSweers/metro/releases
coil3 = "3.6.3" # https://github.com/coil-kt/coil/releases
ktor = "3.6.0" # https://github.com/ktorio/ktor/releases

# Compose
composeMultiplatform = "1.12.1" # https://github.com/JetBrains/compose-multiplatform/releases
compose-navigation3 = "1.1.2" # https://github.com/JetBrains/compose-multiplatform/releases
material3 = "1.11.0-alpha07" # https://github.com/JetBrains/compose-multiplatform/releases
materialKolor = "5.0.1" # https://github.com/jordond/MaterialKolor/releases

# Gradle
gradle-compatibility = "1.1.0" # https://github.com/gradle/gradle-plugin-compatibility-plugin/releases
gradle-download = "5.7.0" # https://github.com/michel-kraemer/gradle-download-task/releases
gradle-publish = "2.2.1" # https://plugins.gradle.org/plugin/com.gradle.plugin-publish

# Android
androidGradle = "9.3.3" # https://mvnrepository.com/artifact/com.android.tools.build/gradle
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "30"

androidx-activity = "1.13.0" # https://developer.android.com/jetpack/androidx/releases/activity
androidx-lifecycle = "2.11.0" # https://developer.android.com/jetpack/androidx/releases/lifecycle
androidx-core = "1.19.1" # https://developer.android.com/jetpack/androidx/releases/core

# Gradle Plugins
mavenPublish = "0.37.0" # https://github.com/vanniktech/gradle-maven-publish-plugin/releases
detekt = "1.23.8" # https://github.com/detekt/detekt/releases

[libraries]
compose-runtime-annotations = { group = "androidx.compose.runtime", name = "runtime-annotation", version.ref = "composeMultiplatform" }
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx-core" }
androidx-lifecycle-navigation3 = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
compose-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
compose-uiTooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }

coil3-core = { group = "io.coil-kt.coil3", name = "coil-core", version.ref = "coil3" }
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
coil3-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil3" }

materialKolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "materialKolor" }
materialKolor-utilities = { group = "com.materialkolor", name = "material-color-utilities", version.ref = "materialKolor" }

# Compose Navigation 3
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "compose-navigation3" }
navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "compose-navigation3" }

# Ktor
ktor-http = { group = "io.ktor", name = "ktor-http", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-resources = { group = "io.ktor", name = "ktor-client-resources", version.ref = "ktor" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-resources = { group = "io.ktor", name = "ktor-server-resources", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Metro
metrox-viewmodel-compose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }
metrox-android = { module = "dev.zacsweers.metro:metrox-android", version.ref = "metro" }

# Kotlinx
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Image processing
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-android = { group = "io.github.zxing-cpp", name = "android", version.ref = "zxing" }

[plugins]
kotlin-conventions = { id = "net.cacheoverflow.kotlinconventions", version.ref = "kotlin-conventions" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
download = { id = "de.undercouch.download", version.ref = "gradle-download" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

# Gradle
gradle-compatibility = { id = "org.gradle.plugin-compatibility", version.ref = "gradle-compatibility" }
gradle-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-publish" }

# Android
android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradle" }
android-application = { id = "com.android.application", version.ref = "androidGradle" }

# Compose
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }